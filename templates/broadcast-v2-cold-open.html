<link rel="stylesheet" href="/static/broadcast-system.css" />
<div class="bcast-reset bcast-frame">
  <div class="bcast-safe"></div>
  <div class="bcast-top-left">
    <div class="bcast-bug"><div class="bcast-bug__mark">2147</div><div class="bcast-bug__word">News<br>Network</div><div class="bcast-bug__accent"></div></div>
    <div class="bcast-live">Live</div>
  </div>
  <div class="bcast-top-right"><div class="bcast-clock">18 Oct 2147 / 19:42 UTC-O</div></div>

  <style>
    .cold-open-alert{position:absolute;left:64px;top:128px;right:64px;z-index:4;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}.cold-open-title{padding:32px 34px;border-radius:28px;background:rgba(248,250,252,.94);backdrop-filter:blur(22px);color:#071426;border-top:8px solid var(--bcast-red);box-shadow:0 30px 80px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.55);animation:bcast-story-slide 7.2s var(--bcast-ease) infinite}.cold-open-title .k{color:var(--bcast-red);font-weight:1000;letter-spacing:.16em;text-transform:uppercase;font-size:13px;margin-bottom:14px}.cold-open-title h1{font-family:var(--bcast-condensed);font-size:clamp(58px,7vw,104px);line-height:.82;letter-spacing:-.06em;text-transform:uppercase;margin:0}.cold-open-title p{margin:18px 0 0;color:#4b5563;font-size:22px;line-height:1.28;font-weight:750}.cold-open-visual{height:310px;border-radius:28px;background:linear-gradient(135deg,rgba(11,27,48,.88),rgba(5,7,13,.96));border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.10);position:relative;overflow:hidden;animation:bcast-ots-zoom 7.2s .2s var(--bcast-ease) infinite}.cold-open-visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:42px 42px}.cold-planet{position:absolute;border-radius:50%;top:78px}.cold-earth{left:54px;width:150px;height:150px;background:radial-gradient(circle at 35% 28%,#e8fbff,#2d8fd8 38%,#071634 78%);box-shadow:0 0 45px rgba(0,166,214,.35)}.cold-mars{right:54px;width:170px;height:170px;background:radial-gradient(circle at 35% 28%,#ffb08d,var(--bcast-mars) 42%,#651c13 78%);box-shadow:0 0 55px rgba(232,93,42,.45);animation:bcast-mars-pulse 3.2s ease-in-out infinite}.cold-split{position:absolute;left:50%;top:44px;bottom:44px;width:5px;background:linear-gradient(transparent,#ff4650,var(--bcast-red),#ff4650,transparent);box-shadow:0 0 35px rgba(215,25,32,.75);transform:rotate(8deg)}.cold-open-visual strong{position:absolute;left:34px;bottom:32px;font-family:var(--bcast-condensed);font-size:52px;line-height:.86;text-transform:uppercase}.cold-open-source{position:absolute;right:64px;top:462px;z-index:7}@media(max-width:900px){.cold-open-alert{display:block}.cold-open-visual{margin-top:20px}.cold-open-source{left:64px;right:auto;top:auto;bottom:165px}}
  </style>

  <section class="cold-open-alert">
    <div class="cold-open-title">
      <div class="k">Breaking / Mars Sovereignty</div>
      <h1>$headline</h1>
      <p>$summary</p>
    </div>
    <div class="cold-open-visual">
      <div class="cold-planet cold-earth"></div><div class="cold-split"></div><div class="cold-planet cold-mars"></div>
      <strong>57%<br>Independence</strong>
    </div>
  </section>
  <div class="cold-open-source"><div class="bcast-source bcast-source--dark"><b class="bcast-source__label">Source</b><span class="bcast-source__text">$source</span></div></div>
  <div class="bcast-strap bcast-strap--breaking"><div class="bcast-strap__label">Breaking</div><div class="bcast-strap__main"><strong class="bcast-strap__headline">$headline</strong><span class="bcast-strap__sub">$summary</span></div><div class="bcast-strap__tag">Live 2147</div></div>
  <div class="bcast-ticker"><div class="bcast-ticker__label">Headlines</div><div class="bcast-ticker__window"><div class="bcast-ticker__crawl"><span>$ticker</span><span>$ticker</span></div></div></div>
</div>
