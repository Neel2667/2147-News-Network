<div class="studio-vw-template">
  <style>
    .studio-vw-template,*{box-sizing:border-box}.studio-vw-template{width:100%;height:100%;min-height:720px;position:relative;overflow:hidden;background:#06111f;color:#f8fafc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.studio-vw-template:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,rgba(0,166,214,.22),transparent 26%),linear-gradient(135deg,#0b1728,#02040a 78%)}.top-left{position:absolute;left:46px;top:34px;display:flex;gap:10px;align-items:center;z-index:30}.bug{display:flex;height:54px;border-radius:12px;overflow:hidden}.mark{width:88px;background:#fff;color:#071426;display:grid;place-items:center;font-family:"Arial Narrow",Impact,sans-serif;font-size:29px;font-weight:1000}.word{width:112px;background:#0f4c81;display:grid;place-items:center;color:white;font-size:12px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.accent{width:6px;background:#d71920}.live{height:38px;display:flex;align-items:center;border-radius:999px;padding:0 14px;background:#d71920;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;font-size:13px}.clock{position:absolute;right:46px;top:42px;z-index:30;height:38px;display:flex;align-items:center;border-radius:999px;padding:0 14px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#dbeafe}.studio{position:absolute;left:54px;right:54px;top:112px;bottom:202px;display:grid;grid-template-columns:390px 1fr;gap:24px;z-index:10}.anchor,.wall{position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,rgba(11,27,48,.92),rgba(5,7,13,.98));border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.36)}.person{position:absolute;left:50%;top:24px;width:250px;height:320px;transform:translateX(-50%)}.hair{position:absolute;left:50%;top:-8px;width:116px;height:60px;transform:translateX(-50%);border-radius:58px 58px 22px 22px;background:#111827}.face{position:absolute;left:50%;top:8px;width:100px;height:108px;transform:translateX(-50%);border-radius:48px;background:linear-gradient(135deg,#f4d7c4,#c99573)}.neck{position:absolute;left:50%;top:108px;width:48px;height:40px;transform:translateX(-50%);background:#c99573}.body{position:absolute;left:50%;top:135px;width:220px;height:185px;transform:translateX(-50%);border-radius:68px 68px 20px 20px;background:linear-gradient(135deg,#f4f8ff,#b8c6d6)}.tie{position:absolute;left:50%;top:135px;width:62px;height:178px;transform:translateX(-50%);background:#071426;clip-path:polygon(50% 0,100% 100%,0 100%)}.desk{position:absolute;left:30px;right:30px;bottom:18px;height:88px;border-radius:40px;background:rgba(255,255,255,.16)}.anchor-name{position:absolute;left:28px;right:28px;bottom:112px;border-radius:22px;background:rgba(248,250,252,.96);color:#071426;padding:16px 18px;z-index:8}.anchor-name .k{color:#0f4c81;font-size:11px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}.anchor-name h2{font-family:"Arial Narrow",Impact,sans-serif;font-size:35px;line-height:.9;text-transform:uppercase;margin:6px 0 4px}.anchor-name p{margin:0;color:#536071;font-size:12px;line-height:1.15;font-weight:800}.quote-card{position:absolute;left:34px;right:34px;top:34px;bottom:34px;background:rgba(248,250,252,.96);color:#071426;border-radius:28px;padding:38px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.quote-card .k{color:#0f4c81;font-size:13px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}.quote-card h1{font-family:"Arial Narrow",Impact,sans-serif;font-size:58px;line-height:.84;text-transform:uppercase;margin:18px 0}.quote-text{font-family:"Arial Narrow",Impact,sans-serif;font-size:45px;line-height:1;color:#071426}.quote-text:before{content:'“';color:#0f4c81}.quote-text:after{content:'”';color:#0f4c81}.lower{position:absolute;left:60px;right:60px;bottom:108px;min-height:92px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.96);color:#071426;display:flex;z-index:20}.lower .role{width:150px;display:grid;place-items:center;background:#071426;color:white;font-size:13px;font-weight:1000;text-transform:uppercase}.lower .name{flex:1;padding:12px 18px}.lower .name strong{display:block;font-family:"Arial Narrow",Impact,sans-serif;font-size:32px;line-height:.9;text-transform:uppercase}.lower .name span{display:block;margin-top:5px;color:#4b5563;font-size:14px;font-weight:800}.lower .loc{width:190px;background:#e8edf5;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:950;text-transform:uppercase;color:#1f2937}.ticker{position:absolute;left:20px;right:20px;bottom:32px;height:60px;border-radius:14px;overflow:hidden;background:rgba(3,5,10,.92);display:flex;z-index:20}.ticker .label{width:184px;display:grid;place-items:center;background:#d71920;font-weight:1000;text-transform:uppercase}.ticker .window{position:relative;flex:1;overflow:hidden}.ticker .crawl{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:17px;font-weight:800;animation:crawl 28s linear infinite}.ticker .crawl span{display:inline-block;padding:0 70px 0 26px}@keyframes crawl{to{transform:translateX(-50%)}}
  </style>
  <div class="top-left"><div class="bug"><div class="mark">2147</div><div class="word">NEWS<br>NETWORK</div><div class="accent"></div></div><div class="live">$live_label</div></div><div class="clock">$timestamp</div><section class="studio"><aside class="anchor"><div class="person"><div class="hair"></div><div class="face"></div><div class="neck"></div><div class="body"></div><div class="tie"></div></div><div class="desk"></div><div class="anchor-name"><div class="k">Anchor Desk</div><h2>$lower_name</h2><p>$lower_title</p></div></aside><main class="wall"><div class="quote-card"><div class="k">$quote_context</div><h1>$headline</h1><div class="quote-text">$quote_text</div></div></main></section><div class="lower"><div class="role">$lower_role</div><div class="name"><strong>$quote_person_name</strong><span>$quote_person_title</span></div><div class="loc">Archive Feed</div></div><div class="ticker"><div class="label">$ticker_label</div><div class="window"><div class="crawl"><span>$ticker</span><span>$ticker</span></div></div></div>
</div>
