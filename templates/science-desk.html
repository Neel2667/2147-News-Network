<style>

ont-size:15px;text-align:right}.right{position:relative;padding:28px;animation:in .9s .12s var(--ease) both}.moon{position:absolute;right:44px;top:48px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#EAFBFF,#A7D5FF 24%,#315F9E 58%,#0A1530 78%);box-shadow:0 0 90px rgba(0,217,255,.25),inset -32px -32px 80px rgba(0,0,0,.5);animation:float 5s var(--ease) infinite}.moon:before{content:"";position:absolute;inset:18%;border:1px solid rgba(255,255,255,.16);border-radius:50%;transform:rotateX(62deg)}.wavebox{position:absolute;left:28px;right:28px;bottom:98px;height:190px;border-radius:28px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);overflow:hidden}.wavebox:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px}.wave{position:absolute;left:24px;right:24px;top:50%;height:90px;display:flex;align-items:center;gap:7px;transform:translateY(-50%)}.wave i{display:block;flex:1;max-width:10px;border-radius:999px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 18px rgba(0,217,255,.32);animation:w 1.8s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.12s}.wave i:nth-child(3n){animation-delay:.24s}.wave i:nth-child(5n){animation-delay:.36s}.signal{position:absolute;left:28px;top:28px;padding:14px 16px;border-radius:22px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.08)}.signal b{display:block;font-size:28px;letter-spacing:-.04em}.signal span{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.source{position:absolute;left:28px;right:28px;bottom:28px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.ticker{position:absolute;left:34px;right:34px;bottom:24px;height:42px;display:flex;align-items:center;overflow:hidden;padding:0 18px;border-radius:999px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.1);color:#DDFBFF;font-size:13px;font-weight:750;letter-spacing:.08em;white-space:nowrap}.ticker span{padding-left:100%;animation:ticker 28s linear infinite}@keyframes ticker{to{transform:translateX(-100%)}}@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-10px) scale(1.02)}}@keyframes w{0%,100%{height:16px;opacity:.4}50%{height:88px;opacity:1}}
