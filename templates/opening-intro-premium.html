<div class="nn-open">
<style>
.nn-open,.nn-open *{box-sizing:border-box}.nn-open{--cyan:#00D9FF;--blue:#2F80FF;--white:#F8FAFC;--muted:#94A3B8;--ease:cubic-bezier(.22,1,.36,1);width:100%;min-height:620px;border-radius:34px;overflow:hidden;position:relative;color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 50% 38%,rgba(0,217,255,.15),transparent 24%),radial-gradient(circle at 50% 50%,#111B3A 0%,#050914 48%,#03040A 100%);isolation:isolate}.nn-open:before{content:"";position:absolute;inset:-10%;background:conic-gradient(from 180deg,transparent,rgba(0,217,255,.22),transparent,rgba(47,128,255,.16),transparent);animation:spin 18s linear infinite;opacity:.8;filter:blur(1px);z-index:-2}.nn-open:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 0 28%,rgba(3,4,10,.22) 45%,rgba(3,4,10,.88) 78%);z-index:-1}@keyframes spin{to{transform:rotate(360deg)}}.orbit{position:absolute;inset:105px;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%;transform:rotateX(64deg);box-shadow:0 0 60px rgba(0,217,255,.08)}.r1{width:520px;height:520px;animation:pulse 4s var(--ease) infinite}.r2{width:700px;height:700px;animation:pulse 4s .4s var(--ease) infinite}.r3{width:880px;height:880px;animation:pulse 4s .8s var(--ease) infinite}@keyframes pulse{50%{opacity:.38;transform:rotateX(64deg) scale(1.03)}}.planet{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#E8FBFF 0 3%,#52DDF1 4%,#1E4FA8 38%,#08142E 70%);box-shadow:0 0 90px rgba(0,217,255,.38),inset -28px -30px 70px rgba(0,0,0,.48);animation:planet 7s var(--ease) infinite}@keyframes planet{50%{transform:translateY(-10px) scale(1.025)}}.title{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:70px;animation:reveal 1.4s var(--ease) both}.kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:800}.title h1{margin:18px 0 10px;font-size:clamp(62px,10vw,132px);line-height:.82;letter-spacing:-.08em;text-shadow:0 18px 80px rgba(0,0,0,.5)}.title p{margin:0;color:#DDFBFF;font-size:clamp(18px,2vw,28px);font-weight:600}.chips{position:absolute;left:28px;right:28px;bottom:26px;display:flex;justify-content:space-between;gap:14px}.chip{padding:11px 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(24px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#EAFBFF}@keyframes reveal{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
</style>
<div class="orbit"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="planet"></div></div>
