<div class="nn-anchor">
<style>
.nn-anchor,.nn-anchor *{box-sizing:border-box}.nn-anchor{--cyan:#00D9FF;--white:#F8FAFC;--muted:#94A3B8;--red:#FF3B3B;--ease:cubic-bezier(.22,1,.36,1);width:100%;min-height:620px;border-radius:34px;overflow:hidden;position:relative;color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 70% 15%,rgba(0,217,255,.2),transparent 28%),linear-gradient(135deg,#071126,#03040A 70%)}.wall{position:absolute;inset:34px 34px 118px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px);overflow:hidden}.wall:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:58px 58px;mask-image:radial-gradient(circle at 60% 45%,#000,transparent 72%);animation:grid 16s linear infinite}@keyframes grid{to{background-position:58px 58px}}.map{position:absolute;right:6%;top:13%;width:46%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,217,255,.26);box-shadow:0 0 80px rgba(0,217,255,.15),inset 0 0 60px rgba(0,217,255,.08);animation:float 5s var(--ease) infinite}.map:before,.map:after{content:"";position:absolute;inset:18%;border:1px solid rgba(255,255,255,.12);border-radius:50%}.map:after{inset:48% 0}.desk{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:78%;height:118px;border-radius:42px 42px 18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.16);box-shadow:0 35px 90px rgba(0,0,0,.45);backdrop-filter:blur(28px)}.anchor-sil{position:absolute;left:16%;bottom:120px;width:150px;height:230px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.45));animation:reveal .9s var(--ease) both}.head{width:70px;height:70px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(0,217,255,.2))}.body{width:150px;height:150px;border-radius:52px 52px 18px 18px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px)}.headline{position:absolute;left:34%;top:110px;width:50%;animation:slide .9s .15s var(--ease) both}.headline .live{display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border-radius:999px;background:rgba(255,59,59,.12);border:1px solid rgba(255,59,59,.32);color:#FFD6D6;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.headline h2{margin:18px 0 12px;font-size:clamp(38px,5vw,72px);line-height:.9;letter-spacing:-.06em}.headline p{margin:0;max-width:620px;color:var(--muted);font-size:clamp(17px,1.6vw,23px);line-height:1.35}.lower{position:absolute;left:48px;bottom:142px;padding:18px 24px;border-radius:24px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(22px);animation:slide .9s .25s var(--ease) both}.lower strong{display:block;font-size:24px;letter-spacing:-.03em}.lower span{display:block;margin-top:5px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}.ticker{position:absolute;left:24px;right:24px;bottom:24px;height:48px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;overflow:hidden;padding:0 18px;color:#DDFBFF;font-weight:700;letter-spacing:.06em;white-space:nowrap}.ticker span{padding-left:100%;animation:ticker 30s linear infinite}@keyframes ticker{to{transform:translateX(-100%)}}@keyframes slide{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes reveal{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(0)}}@keyframes float{50%{transform:translateY(-10px) scale(1.02)}}
</style>
<div class="wall"><div class="map"></div></div><div class="anchor-sil"><div class="head"></div><div class="body"></div></div><div class="headline"><div class="live">● Live Analysis</div><h2>$headline</h2><p>$summary</p></div><div class="desk"></div><div class="lower"><strong>$lower_name</strong><span>$lower_title</span></div><div class="ticker"><span>$ticker</span></div>
